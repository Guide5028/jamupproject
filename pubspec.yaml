name: jamup_app
description: A Flutter app for connecting musicians and venues
publish_to: 'none' # Remove this line if you want to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^5.0.0
  http: ^1.5.0
  provider: ^6.1.5+1
  image_picker: ^1.0.7
  supabase_flutter: ^2.10.0
  flutter_native_splash: ^2.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/