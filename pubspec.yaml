name: jamup_app
description: A Flutter app for connecting musicians and venues
publish_to: 'none' # Remove this line if you want to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^5.0.0
  http: ^1.5.0
  provider: ^6.1.5+1
  image_picker: ^1.0.7
  mime: ^1.0.4
  supabase_flutter: ^2.10.0
  flutter_native_splash: ^2.4.0
  flutter_dotenv: ^6.0.0
  table_calendar: ^3.2.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_places_flutter: ^2.0.8
  onesignal_flutter: ^5.4.1
  timeago: ^3.7.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env